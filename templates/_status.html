<form method="post" action="{% url 'item_status' item.pk %}" class="row" style="gap:6px">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <select name="status" class="inline" onchange="this.form.submit()" aria-label="Status">
    {% for v, l in statuses %}<option value="{{ v }}" {% if v == item.status %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
</form>
