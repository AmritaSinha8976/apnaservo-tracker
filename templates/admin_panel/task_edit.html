{% extends "base.html" %}{% block title %}Edit Task{% endblock %}
{% block content %}
<div class="head"><div><h1>Edit Task</h1><p>{{ item.title }}</p></div><a class="btn ghost" href="{% url 'tasks' %}">← Back</a></div>
<div class="card" style="max-width:560px">
  <form method="post">{% csrf_token %}
    {% include "_form.html" %}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" type="submit">Save Changes</button>
      <a class="btn ghost" href="{% url 'tasks' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
